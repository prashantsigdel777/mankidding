<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – FoodApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="#" class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12h20M6 12a6 6 0 0 0 12 0"/>
        <path d="M12 2v2M8 4l1 2M16 4l-1 2"/>
      </svg>
      FoodApp
    </a>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Menu</a>
    <a href="#">Contact</a>
    <a href="#" class="nav-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      Login
    </a>
  </nav>

  <!-- HERO -->
  <div class="hero">
    <h1>Welcome <span>Back</span></h1>
    <p>Log in to access your account and order delicious food</p>
  </div>

  <!-- CARD -->
  <div class="card-wrapper">
    <div class="card">

      <!-- FORM -->
      <div class="form-side">
        <h2>Sign In</h2>

        <label for="email">Email Address</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="email" id="email" placeholder="axyut9@example.com" autocomplete="email"/>
        </div>

        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
        </div>

        <div class="row-opt">
          <label class="remember">
            <input type="checkbox" id="remember"/> Remember me
          </label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button class="btn-signin" id="signinBtn">
          Sign In
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>

        <div class="divider">Or &nbsp;continue with</div>

        <div class="socials">
          <!-- Google -->
          <button class="social-btn" title="Continue with Google">
            <svg width="22" height="22" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
          </button>
          <!-- Facebook -->
          <button class="social-btn" title="Continue with Facebook">
            <svg width="22" height="22" viewBox="0 0 48 48">
              <path fill="#1877F2" d="M48 24C48 10.745 37.255 0 24 0S0 10.745 0 24c0 11.979 8.776 21.908 20.25 23.708V30.938h-6.094V24h6.094v-5.288c0-6.014 3.583-9.337 9.065-9.337 2.625 0 5.372.469 5.372.469v5.906h-3.026c-2.981 0-3.911 1.85-3.911 3.75V24h6.656l-1.063 6.938H27.75v16.77C39.224 45.908 48 35.979 48 24z"/>
              <path fill="#fff" d="M33.343 30.938 34.406 24H27.75v-4.5c0-1.9.93-3.75 3.911-3.75h3.026V9.844s-2.747-.469-5.372-.469c-5.482 0-9.065 3.323-9.065 9.337V24h-6.094v6.938H20.25v16.77a24.18 24.18 0 0 0 7.5 0V30.938h5.593z"/>
            </svg>
          </button>
        </div>

        <p class="signup-text">Don't have an account? <a href="#">Sign Up</a></p>
      </div>

      <!-- IMAGE -->
      <div class="image-side">
        <img
          src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=700&q=80"
          alt="Delicious food spread with grilled meats, fresh herbs, and dipping sauce"
        />
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
